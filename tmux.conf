# claudes default tmux config — applied to claudes-managed sessions only.
# Override by editing this file (~/.config/claudes/tmux.conf) or by setting
# `tmux_config` in ~/.config/claudes/config.toml.

# Ctrl-Q kills the current session immediately. No prefix.
bind-key -n C-q kill-session

# Quality-of-life
set -g mouse on
set -g history-limit 50000
set -g status off
