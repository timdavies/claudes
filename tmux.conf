# claudes default tmux config — applied to claudes-managed sessions only.
# Override by editing this file (~/.config/claudes/tmux.conf) or by setting
# `tmux_config` in ~/.config/claudes/config.toml.

# Ctrl-Q kills the current session immediately. No prefix.
bind-key -n C-q kill-session

# Quality-of-life
set -g mouse on
set -g history-limit 50000
set -g status off

# Claim the outer terminal's title and pin it to the (prefix-stripped) session
# name. Without this, apps inside tmux (Claude Code, etc.) emit OSC escapes
# that the outer terminal honors — useful in some contexts, but breaks the
# tab integration, which wants the tab title to stay as the agent's name.
set -g set-titles on
set -g set-titles-string '#{s/^claudes-//:session_name}'

# Let apps inside tmux send escape sequences through to the outer terminal
# (cmux, etc.) — required for cmux notifications and similar OSC-based
# integrations. Apps wrap sequences as \ePtmux;<escaped>\e\\ and tmux
# unwraps + forwards.
set -g allow-passthrough on

# Pass through extended key encodings (kitty keyboard protocol / xterm
# modifyOtherKeys), so apps like Claude Code can distinguish Shift+Enter,
# Ctrl+Enter, etc. from plain Enter. Requires tmux 3.2+ and a terminal that
# advertises support (kitty, ghostty, WezTerm, modern iTerm2, alacritty).
set -s extended-keys always
set -as terminal-features 'xterm*:extkeys'

# Mouse wheel scrolls tmux scrollback (enter copy-mode), instead of being
# translated into arrow keys for the running app. Full-screen apps that use
# the alternate screen (vim, less) keep their own scroll behavior.
bind -n WheelUpPane if -F '#{alternate_on}' 'send -M' 'copy-mode -e ; send -M'

# Mouse drag-select copies to the macOS clipboard and exits copy-mode (so
# typing isn't blocked). The highlight vanishes on mouse-up — that's a tmux
# limitation: keeping the selection visible requires staying in copy-mode,
# which captures keystrokes. To use the terminal's native selection (which
# *does* persist visibly) hold Option while dragging — that bypasses tmux's
# mouse capture and lets the outer terminal handle the selection.
bind -T copy-mode    MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"
